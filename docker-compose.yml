networks:
  dev:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
      - '/etc/letsencrypt:/etc/letsencrypt'
      - './certbot-data:/var/www/certbot'
    depends_on:
      - backend
      - frontend
    networks:
      - dev
    restart: always

  backend:
    build: ./backend
    networks:
      - dev
    restart: always

  frontend:
    build: ./frontend
    networks:
      - dev
    restart: always