user  root;
worker_processes  1;
events {
}
http {
    server {
        listen       80;
        server_name  aristokrat.by;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
    server {
        listen       443 ssl;
        server_name  aristokrat.by;
        ssl_certificate     /etc/letsencrypt/live/aristokrat.by/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aristokrat.by/privkey.pem;

        location / {
            proxy_pass http://frontend:80/;
        }
        location /api/ {
            proxy_pass http://backend:8000/;
        }
    }
}